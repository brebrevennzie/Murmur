<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#2D112A" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E5" />
      <stop offset="40%" stop-color="#F4B5CD" />
      <stop offset="80%" stop-color="#E2729D" />
      <stop offset="100%" stop-color="#B24B76" />
    </linearGradient>
    <linearGradient id="snakeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B5CD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2729D" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#snakeGlow)" stroke-width="3" />

  <!-- Background Subtle Aura -->
  <circle cx="256" cy="256" r="160" fill="#F4B5CD" opacity="0.08" filter="url(#glow)" />

  <!-- Stylized Elegant Serpent (S-Curve Body) -->
  <g transform="translate(0, 0)">
    <!-- Snake Shadow/Glow Path -->
    <path d="M 270 95 C 330 95, 370 135, 360 185 C 350 235, 220 230, 200 290 C 180 350, 240 410, 310 400 C 350 395, 375 365, 360 340 C 345 320, 310 325, 305 345 C 300 365, 320 375, 310 378 C 260 385, 220 345, 235 300 C 255 240, 395 240, 400 170 C 405 100, 330 55, 250 65 C 200 70, 160 100, 165 145 C 170 180, 200 190, 200 170 C 200 150, 185 145, 185 135 C 185 115, 215 95, 270 95 Z" 
          fill="none" stroke="url(#snakeGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

    <!-- Main Serpent Body -->
    <path d="M 285 85 C 360 85, 385 140, 365 190 C 340 250, 200 240, 190 310 C 180 380, 250 425, 325 410 C 375 400, 395 350, 365 325 C 335 300, 295 325, 310 355 C 320 375, 345 370, 340 380 C 310 400, 240 385, 230 330 C 220 270, 355 260, 380 190 C 400 130, 355 70, 285 65 Z" 
          fill="url(#snakeGrad)" />

    <!-- Crown / Cobra Hood Details / Head Accent -->
    <!-- Head -->
    <path d="M 285 60 C 310 60, 335 80, 320 105 C 305 125, 270 125, 255 105 C 240 80, 260 60, 285 60 Z" 
          fill="#FFD6E5" />

    <!-- Snake Eyes (Glowing Pink/White) -->
    <circle cx="275" cy="85" r="5" fill="#12131A" />
    <circle cx="276" cy="84" r="2" fill="#FFFFFF" />

    <circle cx="295" cy="85" r="5" fill="#12131A" />
    <circle cx="296" cy="84" r="2" fill="#FFFFFF" />

    <!-- Forked Tongue -->
    <path d="M 285 58 L 285 40 L 277 30 M 285 40 L 293 30" 
          fill="none" stroke="#FFD6E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Scales Pattern Sparks -->
    <circle cx="320" cy="140" r="3" fill="#FFFFFF" opacity="0.6" />
    <circle cx="300" cy="180" r="4" fill="#FFFFFF" opacity="0.5" />
    <circle cx="260" cy="230" r="3" fill="#FFFFFF" opacity="0.6" />
    <circle cx="220" cy="280" r="4" fill="#FFFFFF" opacity="0.5" />
    <circle cx="250" cy="350" r="3.5" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>
